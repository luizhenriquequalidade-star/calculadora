<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de bobina premium com visual moderno.">
    <title>⚡ Calculadora de Bobina Pro</title>

    <!-- Referência ao manifest.json (PWA) -->
    <link rel="manifest" href="manifest.json">

    <!-- Ícone para navegadores (opcional, mas recomendado) -->
    <link rel="icon" href="icon-192.png" type="image/png">

    <!-- Fonte Google: Inter + Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29, #1a1a3e, #24243e);
            background-size: 300% 300%;
            animation: gradientShift 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.06), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .caixa {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 36px 32px;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            transition: transform 0.3s ease;
        }

        .caixa:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 28px;
            background: linear-gradient(135deg, #fff, #a8edea 40%, #fed6e3 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        .campo {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        label svg {
            width: 18px;
            height: 18px;
            stroke: #a0e9ff;
            fill: none;
            stroke-width: 2;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            font-size: 18px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #a0e9ff;
            box-shadow: 0 0 0 4px rgba(160, 233, 255, 0.2);
        }

        .resultado {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 24px;
            margin-top: 10px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .resultado::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent 40%);
            animation: rotateGlow 6s linear infinite;
            z-index: 0;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .resultado-titulo {
            position: relative;
            z-index: 1;
            font-size: 12px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .total {
            position: relative;
            z-index: 1;
            font-family: 'Poppins', sans-serif;
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            word-break: break-word;
        }

        .unidade {
            position: relative;
            z-index: 1;
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .unidade span {
            color: #a0e9ff;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .caixa {
                margin: 16px;
                padding: 24px 20px;
                border-radius: 20px;
            }
            h2 {
                font-size: 22px;
            }
            .total {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>
    <div class="caixa">
        <h2>⚡ Calculadora de Bobina</h2>

        <div class="campo">
            <label for="bobina">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/></svg>
                Metade da bobina
            </label>
            <input type="number" id="bobina" placeholder="Digite o valor" min="0" step="any" oninput="calcular()">
        </div>

        <div class="campo">
            <label for="largura">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18"/></svg>
                Largura (cm)
            </label>
            <input type="number" id="largura" value="64" placeholder="Digite a largura" min="0" step="any" oninput="calcular()">
        </div>

        <div class="campo">
            <label for="densidade">
                <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="4"/></svg>
                Densidade (fator)
            </label>
            <input type="number" id="densidade" value="1.35" placeholder="Digite a densidade" min="0" step="any" oninput="calcular()">
        </div>

        <div class="resultado">
            <div class="resultado-titulo">Resultado</div>
            <div class="total" id="total">0</div>
            <div class="unidade">Largura utilizada: <span id="larguraUsada">64</span> cm</div>
        </div>
    </div>

    <script>
        function calcular() {
            const bobinaInput = document.getElementById("bobina");
            const larguraInput = document.getElementById("largura");
            const densidadeInput = document.getElementById("densidade");
            const totalElement = document.getElementById("total");
            const larguraUsadaElement = document.getElementById("larguraUsada");

            const bobina = Number(bobinaInput.value);
            const largura = Number(larguraInput.value);
            const densidade = Number(densidadeInput.value);

            if (largura > 0) {
                larguraUsadaElement.innerText = largura.toLocaleString("pt-BR");
            } else {
                larguraUsadaElement.innerText = "0";
            }

            if (bobina <= 0 || largura <= 0 || densidade <= 0) {
                totalElement.innerText = "0";
                return;
            }

            let resultado = bobina + 5;
            resultado = resultado * resultado;
            resultado = resultado - 25;
            resultado = resultado * 3.14;
            resultado = resultado * largura;
            resultado = resultado * densidade;

            totalElement.innerText = resultado.toLocaleString("pt-BR", {
                maximumFractionDigits: 2
            });
        }

        window.onload = calcular;
    </script>
</body>
</html>
