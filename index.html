<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Calculadora de bobina premium com visual moderno.">
    <title>⚡ Calculadora de Bobina Pro</title>

    <!-- Configurações para PWA e Atalhos -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCBmaWxsPSIjMGYwYzI5IiB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIwIi8+PHRleHQgeD0iNTAiIHk9IjYwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iNDAiIGZpbGw9IiNhOGVkZWEiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSJib2xkIj7impw8L3RleHQ+PC9zdmc+" type="image/svg+xml">
    
    <!-- Metatags para iOS (iPhone/iPad) salvar o ícone e abrir em tela cheia -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calculadora">

    <!-- Fonte Google: Inter + Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29, #1a1a3e, #24243e);
            background-size: 300% 300%;
            animation: gradientShift 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.06), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .caixa {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px 24px;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            transition: transform 0.3s ease;
            margin: 16px;
        }

        h2 {
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 26px;
            background: linear-gradient(135deg, #fff, #a8edea 40%, #fed6e3 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .campo {
            margin-bottom: 16px;
            position: relative;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        label svg {
            width: 16px;
            height: 16px;
            stroke: #a0e9ff;
            fill: none;
            stroke-width: 2;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 17px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #a0e9ff;
            box-shadow: 0 0 0 4px rgba(160, 233, 255, 0.2);
        }

        .resultado {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 20px;
            margin-top: 10px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .resultado::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent 40%);
            animation: rotateGlow 6s linear infinite;
            z-index: 0;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .resultado-titulo {
            position: relative;
            z-index: 1;
            font-size: 11px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .total {
            position: relative;
            z-index: 1;
            font-family: 'Poppins', sans-serif;
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            word-break: break-word;
        }

        .unidade {
            position: relative;
            z-index: 1;
            margin-top: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .unidade span {
            color: #a0e9ff;
            font-weight: 600;
        }

        .acoes {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .botao {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            text-decoration: none;
            display: block;
            width: 100%;
        }

        .botao-primario {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            color: #1a1a3e;
        }

        .botao-secundario {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .botao:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .dica {
            display: none;
            text-align: center;
            color: #fff;
            font-size: 12px;
            margin-top: 10px;
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .caixa {
                padding: 20px 16px;
                border-radius: 20px;
            }
            h2 { font-size: 22px; }
            .total { font-size: 36px; }
            .botao { font-size: 14px; padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="caixa">
        <h2>⚡ Calculadora de Bobina</h2>

        <div class="campo">
            <label for="bobina">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/></svg>
                Metade da bobina
            </label>
            <input type="number" id="bobina" placeholder="Digite o valor" min="0" step="any" oninput="calcular()">
        </div>

        <div class="campo">
            <label for="largura">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18"/></svg>
                Largura (cm)
            </label>
            <input type="number" id="largura" value="64" placeholder="Digite a largura" min="0" step="any" oninput="calcular()">
        </div>

        <div class="campo">
            <label for="densidade">
                <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="4"/></svg>
                Densidade (fator)
            </label>
            <input type="number" id="densidade" value="1.35" placeholder="Digite a densidade" min="0" step="any" oninput="calcular()">
        </div>

        <div class="resultado">
            <div class="resultado-titulo">Resultado</div>
            <div class="total" id="total">0</div>
            <div class="unidade">Largura utilizada: <span id="larguraUsada">64</span> cm</div>
        </div>

        <div class="acoes">
            <button id="installButton" class="botao botao-primario">📲 Instalar App (Salvar Atalho)</button>
            <button id="fullscreenButton" class="botao botao-secundario">⛶ Tela Cheia</button>
            <button id="downloadHTMLButton" class="botao botao-secundario">⬇️ Baixar Calculadora (HTML)</button>
        </div>

        <p id="installHint" class="dica">
            Para instalar no iPhone: Toque em Compartilhar e depois em "Adicionar à Tela de Início".
        </p>
    </div>

    <script>
        // Salvar o HTML original antes de qualquer interação
        const originalHTML = document.documentElement.outerHTML;

        function calcular() {
            const bobinaInput = document.getElementById("bobina");
            const larguraInput = document.getElementById("largura");
            const densidadeInput = document.getElementById("densidade");
            const totalElement = document.getElementById("total");
            const larguraUsadaElement = document.getElementById("larguraUsada");

            const bobina = Number(bobinaInput.value);
            const largura = Number(larguraInput.value);
            const densidade = Number(densidadeInput.value);

            if (largura > 0) {
                larguraUsadaElement.innerText = largura.toLocaleString("pt-BR");
            } else {
                larguraUsadaElement.innerText = "0";
            }

            if (bobina <= 0 || largura <= 0 || densidade <= 0) {
                totalElement.innerText = "0";
                return;
            }

            let resultado = bobina + 5;
            resultado = resultado * resultado;
            resultado = resultado - 25;
            resultado = resultado * 3.14;
            resultado = resultado * largura;
            resultado = resultado * densidade;

            totalElement.innerText = resultado.toLocaleString("pt-BR", {
                maximumFractionDigits: 2
            });
        }

        window.onload = calcular;

        // Lógica de Tela Cheia
        const fullscreenButton = document.getElementById('fullscreenButton');
        fullscreenButton.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Erro ao tentar tela cheia: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // Lógica de instalação PWA
        let deferredPrompt = null;
        const installButton = document.getElementById('installButton');
        const downloadHTMLButton = document.getElementById('downloadHTMLButton');
        const installHint = document.getElementById('installHint');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installButton.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const choiceResult = await deferredPrompt.userChoice;
                if (choiceResult.outcome === 'accepted') {
                    console.log('Usuário aceitou a instalação');
                }
                deferredPrompt = null;
            } else {
                // Fallback: baixar HTML e mostrar dica
                downloadHTML();
                installHint.style.display = 'block';
                setTimeout(() => {
                    installHint.style.display = 'none';
                }, 8000);
            }
        });

        downloadHTMLButton.addEventListener('click', () => {
            downloadHTML();
        });

        function downloadHTML() {
            const blob = new Blob([originalHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'calculadora-bobina.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        window.addEventListener('appinstalled', () => {
            installHint.textContent = 'Aplicativo instalado com sucesso!';
            installHint.style.display = 'block';
            setTimeout(() => {
                installHint.style.display = 'none';
            }, 4000);
        });

        // Registro do Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('Service Worker registrado!'))
                    .catch(err => console.log('Erro no SW:', err));
            });
        }
    </script>
</body>
</html>
